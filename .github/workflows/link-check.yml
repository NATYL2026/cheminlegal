name: Check official links

# Every Monday, check that every official link on the site still works.
# If some are broken, open (or update) an issue listing them.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Government sites often block robots (403) or rate-limit (429); those are not broken links.
          args: --no-progress --max-retries 3 --timeout 30 --accept 200..=299,403,429 index.html
          output: ./lychee-report.md
          fail: false

      - name: Open an issue if links are broken
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Liens officiels cassés à vérifier"
          content-filepath: ./lychee-report.md
          labels: liens-casses
